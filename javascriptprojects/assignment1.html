    <form id="updatePasswordForm" class="flex flex-col gap-3">

        <input id="newPassword" placeholder="Create new password" type="password" class="rounded-lg border px-4 py-1">
        <p id="newPasswordErrMsg" class="text-red-500"></p>
        <label for="confirmPassword" class="text-white">CONFIRM PASSWORD</label>
        <input id="confirmPassword" placeholder="Confirm password" type="password" class="rounded-lg border px-4 py-1">
        <p id="confirmPasswordErrMsg" class="text-red-500"></p>
        <div class="text-center"><button id="updateBtn" type="submit" class="bg-blue-500 px-5 py-3 rounded-lg text-white">Update</button></div>
