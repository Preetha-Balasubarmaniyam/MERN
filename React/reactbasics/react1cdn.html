<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React CDN</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <div id="root">
    </div>
    <script>
        const nestedDiv = React.createElement(
      "div", {style: { padding: "20px", backgroundColor: "#ddd4f2" }, id:"2"},
      React.createElement("h1",{class:"heading1"},null,"Heading 1"),
      React.createElement("h1",{class:"heading2"},null,"Heading 2")
        )

    // Render to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(nestedDiv);
    </script>
</body>
</html>
